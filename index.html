<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temurshox Mebel</title>
<script src="/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f1ec;color:#222}
header{background:#1d1d1d;color:#fff;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}
header b{margin-right:10px}header button{background:#333;color:#fff;border:0;padding:9px 13px;border-radius:6px;font-size:15px;cursor:pointer}header button.on{background:#c9892b}
main{padding:14px}input,select,textarea,button{font:inherit}input,select,textarea{padding:9px;border:1px solid #bbb;border-radius:6px;margin:3px 0;width:100%}
.btn{background:#c9892b;color:#fff;border:0;padding:9px 14px;border-radius:6px;cursor:pointer}.btn.g{background:#2e8b57}.btn.r{background:#b33}.btn.s{padding:4px 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 4px #0002}.card img{width:100%;height:150px;object-fit:cover;border-radius:6px;cursor:pointer}
.no{font-size:24px;font-weight:700}.box{background:#fff;border-radius:10px;padding:14px;max-width:600px;margin:0 auto 14px}
.imgs img{height:90px;margin:3px;border-radius:6px}.tv header b{font-size:20px}.tv .card{font-size:20px}.tv .no{font-size:34px}
#modal{position:fixed;inset:0;background:#000b;display:none;overflow:auto;z-index:9;padding:14px}#modal .box{max-width:700px}#modal .big img{width:100%;margin:4px 0;border-radius:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:14px 22px;border-radius:8px;font-size:20px;display:none;z-index:99}
#pr{display:none}.pg{page-break-after:always}.ph{font-size:22px;font-weight:800;border-bottom:3px solid #000;margin-bottom:10px}.ph small{font-size:16px;font-weight:400}.g20{display:grid;grid-template-columns:1fr 1fr;gap:2mm}.slip{border:1px dashed #000;padding:1.5mm;height:24mm;overflow:hidden;display:flex;gap:2mm;align-items:center;font-size:12px;line-height:1.25}.slip b.t{font-size:14px}.pg:last-child{page-break-after:auto}@page{size:A4;margin:7mm}
@page{size:A4;margin:7mm}.pg{page-break-after:always}.pg:last-child{page-break-after:auto}.ph{font-size:24px;margin-bottom:2mm;line-height:1.1}.gr{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 2mm}.slip{height:24mm;margin:0;padding:1mm 2mm;gap:8px;align-items:center;overflow:hidden;font-size:14px;line-height:1.25}.slip b{font-size:15px!important}.tx{min-width:0}
@media print{body>*:not(#pr){display:none!important}#pr{display:block}}
.board{display:grid;gap:10px;align-items:start;overflow-x:auto;padding-bottom:10px}.col{background:#e6e2d8;border-radius:10px;padding:8px;min-width:0}.col h3{margin:0 0 2px;font-size:18px;display:flex;justify-content:space-between;align-items:center}.col .cnt{background:#c9892b;color:#fff;border-radius:12px;padding:1px 10px;font-size:16px}.col.dn .cnt{background:#2e8b57}.col .wk{font-size:13px;color:#666;margin-bottom:8px}.col .card{margin-bottom:8px;padding:8px}.col .no{font-size:19px}.col .emp{color:#888;font-size:14px;margin:4px}.tv .col .no{font-size:26px}
</style></head><body><div id="app"></div><div id="modal"></div><div id="toast"></div><div id="pr"></div>
<script>
let T=localStorage.t||'',S=null,tab='all',role='',sel={},app=document.getElementById('app');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u,b){const r=await fetch('/api/'+u,{method:'POST',headers:{'Content-Type':'application/json','x-token':T},body:JSON.stringify(b||{})});if(r.status===401&&u!=='login'){logout();return{e:'auth'}}return r.json()}
const A=async b=>{const r=await api('a',b);if(r.e)alert(r.e);await load(true)};
function toast(m,bad){const t=$('toast');t.textContent=m;t.style.background=bad?'#b33':'#2e8b57';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
function logout(){localStorage.t='';T='';render()}
async function load(force){if(!T){if(!$('lu'))render();return}const s=await api('state');if(s.e)return;S=s;role=s.role;if(force||/^(s\d|done|all)/.test(tab))render()}
function login(){return `<div class="box" style="margin-top:12vh;text-align:center"><h2>TEMURSHOX MEBEL</h2><input id="lu" name="fld_a1" type="text" placeholder="Login" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')"><input id="lp" name="fld_b2" type="password" placeholder="Parol" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')"><br><br><button class="btn" onclick="doLogin()">Kirish</button></div>`}
async function doLogin(){const r=await api('login',{u:$('lu').value.trim(),p:$('lp').value});if(r.e)return alert(r.e);T=r.t;localStorage.t=T;await load(true);openHash()}
const day=t=>new Date(t+5*36e5).toISOString().slice(0,10),wset=id=>A({a:'wset',w:id,line:$('l'+id).value,help:$('h'+id).value});
function banner(){const d=day(Date.now()),m=[];S.stages.forEach((x,i)=>{if(S.orders.some(o=>o.stage===i)||!S.orders.some(o=>o.stage>i&&o.hist.some(k=>k.s===i+1&&day(k.t)===d)))return;const g={};S.workers.filter(w=>w.line===i&&w.help>=0&&w.help!==i&&S.orders.some(o=>o.stage===w.help)).forEach(w=>(g[w.help]=g[w.help]||[]).push(w.name));for(const t in g)m.push(`✅ ${esc(x)} tugadi: <b>${g[t].map(esc).join(', ')}</b> → <b>${esc(S.stages[t])}</b> ga yordamga boringlar!`)});return m.map(x=>`<div style="background:#2e8b57;color:#fff;padding:12px;border-radius:8px;margin-bottom:8px;font-size:1.25em">${x}</div>`).join('')}
function card(o){const done=o.stage>=S.stages.length;return `<div class="card"><div onclick="detail('${o.id}')"><div class="no">№${o.no} · ${esc(o.model)}</div><div>${esc(o.cat)} — <b>${esc(o.qty)} ta</b></div><div style="color:#777">${esc(o.note)} ${o.date}${o.done?' → '+o.done:''}</div></div><div style="margin-top:6px;display:flex;gap:5px">${done?'':`<button class="btn g s" onclick="adv('${o.id}')">Tugadi →</button>`}${role==='admin'?`<button class="btn s" onclick="printOrders(['${o.id}'])">🖨</button><button class="btn r s" onclick="if(confirm('O\\'chirilsinmi?'))A({a:'ord-',id:'${o.id}'})">🗑</button>`:''}</div></div>`}
async function adv(id){const r=await api('adv',{id});if(r.e){toast(r.e,1)}else{const o=r.o;toast(`№${o.no} ${o.model}: `+(o.stage>=S.stages.length?'TAYYOR ✅':S.stages[o.stage]+'ga o\'tdi'))}await load(true)}
function view(){const st=S.stages;let h='';
if(tab==='all'){const n=st.length+1,today=day(Date.now());const dn=S.orders.filter(o=>o.stage>=st.length&&o.done===today);h=`<h2>Barcha zakazlar <small style="font-weight:400">(${S.orders.filter(o=>o.stage<st.length).length} ta jarayonda)</small></h2><div class="board" style="grid-template-columns:repeat(${n},minmax(210px,1fr))">${st.map((x,i)=>{const l=S.orders.filter(o=>o.stage===i);return `<div class="col"><h3>${esc(x)} <span class="cnt">${l.length}</span></h3><div class="wk">👷 ${S.workers.filter(w=>w.line===i).map(w=>esc(w.name)).join(', ')||'—'}</div>${l.map(card).join('')||'<p class="emp">Zakaz yo\'q</p>'}</div>`}).join('')}<div class="col dn"><h3>✅ Tayyor (bugun) <span class="cnt">${dn.length}</span></h3>${dn.map(card).join('')||'<p class="emp">Hali yo\'q</p>'}</div></div>`}
else if(tab[0]==='s'){const i=+tab.slice(1),l=S.orders.filter(o=>o.stage===i);h=`<h2>${esc(st[i])} (${l.length}) <small style="font-weight:400">👷 ${S.workers.filter(w=>w.line===i).map(w=>esc(w.name)).join(', ')}</small></h2><div class="grid">${l.map(card).join('')||'<p>Zakaz yo\'q</p>'}</div>`}
else if(tab==='done'){const l=S.orders.filter(o=>o.stage>=st.length),d=sel.d||'';const ds=[...new Set(l.map(o=>o.done))].sort().reverse();h=`<h2>Tayyor zakazlar</h2><select onchange="sel.d=this.value;render()" style="max-width:250px"><option value="">Barcha kunlar</option>${ds.map(x=>`<option ${x===d?'selected':''}>${x}</option>`)}</select><div class="grid">${l.filter(o=>!d||o.done===d).reverse().map(card).join('')}</div>`}
else if(tab==='new'){const c=S.cats.find(x=>x.id===sel.c),m=c&&c.models.find(x=>x.id===sel.m);h=`<div class="box"><h2>Yangi zakaz</h2><select onchange="sel.c=this.value;sel.m='';render()"><option value="">Kategoriya...</option>${S.cats.map(x=>`<option value="${x.id}" ${x.id===sel.c?'selected':''}>${esc(x.name)}</option>`)}</select><select onchange="sel.m=this.value;render()"><option value="">Model...</option>${(c?c.models:[]).map(x=>`<option value="${x.id}" ${x.id===sel.m?'selected':''}>${esc(x.name)}</option>`)}</select><div class="imgs">${m?m.imgs.map(i=>`<img src="${i}">`).join(''):''}</div><input id="qt" placeholder="Soni"><input id="nt" placeholder="Izoh"><label>Qaysi bo'limdan boshlansin:</label><select id="sg">${st.map((x,i)=>`<option value="${i}">${esc(x)}</option>`)}</select><br><br><button class="btn" onclick="addOrd(0)">Saqlash</button> <button class="btn g" onclick="addOrd(1)">Saqlash + Chop etish</button></div>
<div class="box"><b>Bugungi zakazlarni chop etish</b><br><br><button class="btn" onclick="printOrders(S.orders.filter(o=>o.date===new Date(Date.now()+5*36e5).toISOString().slice(0,10)).map(o=>o.id))">🖨 Bugungi hammasi</button></div>`}
else if(tab==='cat'){h=`<div class="box"><h2>Katalog</h2><input id="cn" placeholder="Yangi kategoriya"><button class="btn" onclick="A({a:'cat+',n:$('cn').value})">+ Kategoriya</button></div>`+S.cats.map(c=>`<div class="box"><b>${esc(c.name)}</b> <button class="btn r s" onclick="if(confirm('O\\'chirilsinmi?'))A({a:'cat-',c:'${c.id}'})">🗑</button><br><input id="m${c.id}" placeholder="Yangi model" style="width:60%"> <button class="btn s" onclick="A({a:'model+',c:'${c.id}',n:$('m${c.id}').value})">+ Model</button>${c.models.map(m=>`<div style="margin-top:10px;border-top:1px solid #ddd;padding-top:6px">${esc(m.name)} <button class="btn r s" onclick="A({a:'model-',c:'${c.id}',m:'${m.id}'})">🗑</button> <label class="btn s">+ Rasm<input type="file" accept="image/*" multiple hidden onchange="upl(this,'${c.id}','${m.id}')"></label><div class="imgs">${m.imgs.map(i=>`<span><img src="${i}"><button class="btn r s" onclick="A({a:'img-',c:'${c.id}',m:'${m.id}',i:'${i}'})">x</button></span>`).join('')}</div></div>`).join('')}</div>`).join('')}
else if(tab==='usr'){h=`<div class="box"><h2>Xodimlar</h2><input id="xu" placeholder="Login"><input id="xp" placeholder="Parol"><button class="btn" onclick="A({a:'user+',u:$('xu').value.trim(),p:$('xp').value})">+ Qo'shish</button><hr>${S.users.map(u=>`<div>${esc(u.u)} / ${esc(u.p)} (${u.role}) ${u.role==='admin'?'':`<button class="btn r s" onclick="A({a:'user-',u:'${esc(u.u)}'})">🗑</button>`}</div>`).join('')}</div>`}
else if(tab==='wk'){const lo=(v,all)=>`<option value="-1">${all}</option>`+st.map((x,i)=>`<option value="${i}" ${v===i?'selected':''}>${esc(x)}</option>`).join('');h=`<div class="box"><h2>Ishchilar</h2><input id="wn" placeholder="Ishchi ismi"><button class="btn" onclick="A({a:'w+',n:$('wn').value.trim()})">+ Qo'shish</button></div><div class="box"><b>Har bir linyaga kerakli odam soni</b><br>${st.map((x,i)=>`${esc(x)}: <input class="cap" type="number" min="0" value="${S.cap[i]||0}" style="width:70px"> (hozir ${S.workers.filter(w=>w.line===i).length})<br>`).join('')}<br><button class="btn" onclick="A({a:'cap',v:[...document.querySelectorAll('.cap')].map(x=>+x.value||0)})">Saqlash</button> <button class="btn g" onclick="A({a:'auto'})">Avto taqsimlash</button></div><div class="box"><table style="width:100%"><tr><th align=left>Ishchi<th align=left>Linya<th align=left>Ish tugagach →<th></tr>${S.workers.map(w=>`<tr><td><b>${esc(w.name)}</b><td><select id="l${w.id}" onchange="wset('${w.id}')">${lo(w.line,'— yo\'q —')}</select><td><select id="h${w.id}" onchange="wset('${w.id}')">${lo(w.help,'— hech qayer —')}</select><td><button class="btn r s" onclick="A({a:'w-',w:'${w.id}'})">🗑</button></tr>`).join('')}</table></div>`}
else if(tab==='set'){h=`<div class="box"><h2>Bo'lim nomlari</h2>${st.map((x,i)=>`<input class="stn" value="${esc(x)}">`).join('')}<br><br><button class="btn" onclick="A({a:'stages',v:[...document.querySelectorAll('.stn')].map(x=>x.value||'-')})">Saqlash</button></div>`}
return (/^(s\d|done|all)/.test(tab)?banner():'')+h}
function render(){if(!T||!S){app.innerHTML=login();return}const st=S.stages,adm=role==='admin';
app.className=sel.tv?'tv':'';app.innerHTML=`<header><b>TEMURSHOX MEBEL</b><button class="${tab==='all'?'on':''}" onclick="tab='all';render()">🗂 Hammasi</button>${st.map((x,i)=>`<button class="${tab==='s'+i?'on':''}" onclick="tab='s${i}';render()">${esc(x)} ${S.orders.filter(o=>o.stage===i).length}</button>`).join('')}<button class="${tab==='done'?'on':''}" onclick="tab='done';render()">✅ Tayyor</button>${adm?[['new','➕ Zakaz'],['cat','📁 Katalog'],['usr','👥 Xodim'],['wk','👷 Ishchilar'],['set','⚙']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join(''):''}<button onclick="sel.tv=!sel.tv;render()">📺</button><button onclick="logout()">Chiqish</button></header><main>${view()}</main>`}
function addOrd(p){const c=sel.c,m=sel.m;if(!m)return alert('Kategoriya va modelni tanlang');A({a:'ord+',c,m,qty:$('qt').value,note:$('nt').value,stage:$('sg').value}).then(()=>{if(p)printOrders([S.orders[S.orders.length-1].id])})}
function upl(inp,c,m){[...inp.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);A({a:'img+',c,m,d:cv.toDataURL('image/jpeg',.8)})};im.src=r.result};r.readAsDataURL(f)})}
function detail(id,img){const o=S.orders.find(x=>x.id===id);const md=$('modal');if(!o){md.innerHTML='<div class="box">Zakaz topilmadi <button class="btn" onclick="closeM()">OK</button></div>';md.style.display='block';return}
md.innerHTML=`<div class="box"><h2>№${o.no} · ${esc(o.model)}</h2><p>${esc(o.cat)} — <b>${esc(o.qty)} ta</b><br>${esc(o.note)}<br>Hozirgi bo'lim: <b>${o.stage>=S.stages.length?'TAYYOR':esc(S.stages[o.stage])}</b></p>${o.stage<S.stages.length?`<button class="btn g" onclick="adv('${o.id}').then(closeM)">Bu bosqichni tugatdim →</button>`:''} <button class="btn" onclick="closeM()">Yopish</button><div class="big">${img?o.imgs.map(i=>`<img src="${i}">`).join(''):''}</div></div>`;md.style.display='block'}
function closeM(){$('modal').style.display='none';history.replaceState(0,'',location.pathname)}
function openHash(){const m=location.hash.match(/#o\/(\w+)/);if(m&&S)detail(m[1],1)}
function printOrders(ids){const l=S.orders.filter(o=>ids.includes(o.id));if(!l.length)return alert("Zakaz yo'q");const ch=[];for(let k=0;k<l.length;k+=20)ch.push(l.slice(k,k+20));$('pr').innerHTML=S.stages.map((s,i)=>ch.map((c,pi)=>`<div class="pg"><div class="ph">${esc(s).toUpperCase()} <small>${S.workers.filter(w=>w.line===i).map(w=>esc(w.name)).join(', ')} · ${day(Date.now())}${ch.length>1?' · '+(pi+1)+'/'+ch.length+'-bet':''}</small></div><div class="gr">${c.map(o=>`<div class="slip"><div id="q${o.id}_${i}"></div><div class="tx"><b>№${o.no} · ${esc(o.model)}</b><br>${esc(o.cat)} — <b>${esc(o.qty)} ta</b><br>${esc(o.note)}</div></div>`).join('')}</div></div>`).join('')).join('');S.stages.forEach((s,i)=>l.forEach(o=>new QRCode($('q'+o.id+'_'+i),{text:location.origin+'/#o/'+o.id,width:80,height:80})));setTimeout(()=>window.print(),500)}
// Skaner (USB pult klaviatura kabi yozadi)
let buf='',bt;document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!T)return;if(e.key==='Enter'){const m=buf.match(/#o\/(\w+)/)||buf.match(/^(\w{10})$/);buf='';if(m)adv(m[1]);return}if(e.key.length===1){buf+=e.key;clearTimeout(bt);bt=setTimeout(()=>buf='',400)}});
addEventListener('hashchange',openHash);
setInterval(()=>{if($('modal').style.display!=='block')load()},4000);
load(true).then(openHash);
</script></body></html>
